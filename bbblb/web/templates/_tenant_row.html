        {% set stats = tenant_stats[tenant.id] %}
        <tr>
          <td>{{ tenant.name }}</td>
          <td>{{ "Yes" if tenant.enabled else "No" }}</td>
          <td><a href="//{{ tenant.realm }}/bigbluebutton/api">{{ tenant.realm }}</a></td>
          <td><a href="/bbblb/admin/meetings?tenant={{ tenant.name|urlencode }}">{{ stats.meetings }}</a></td>
          <td>{{ stats.recordings }}</td>
          <td>{{ "%.2f"|format(stats.recording_hours) }}</td>
          {% if ctx.is_admin %}
          <td>
            <form method="post" action="/bbblb/admin/tenant"
                  hx-post="/bbblb/admin/tenant"
                  hx-target="closest tr"
                  hx-swap="outerHTML"
                  hx-disabled-elt="find button"
                  hx-sync="body:replace">
              <input type="hidden" name="csrf" value="{{ ctx.get_csrf() }}">
              <input type="hidden" name="name" value="{{ tenant.name }}">
              <input type="hidden" name="action" value="{{ "disable" if tenant.enabled else "enable" }}">
              <button type="submit">{{ "Disable" if tenant.enabled else "Enable" }}</button>
            </form>
          </td>
          {% endif %}
        </tr>
