[project]
name = "bbblb"
dynamic = ["version"]
description = "Load balancer for BigBlueButton"
readme = "README.md"
authors = [
  {name = "Marcel Hellkamp", email = "me@defnull.de"},
]
license = "AGPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

requires-python = ">=3.13"
dependencies = [
    "aiodns>=4.0.0",
    "aiohttp>=3.13.5",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "click>=8.3.2",
    "lxml>=6.0.3",
    "psycopg[binary]>=3.3.3",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
server = [
    "httptools>=0.7.1",
    "uvicorn>=0.44.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lxml-stubs>=0.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "uvicorn>=0.44.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "watchdog>=6.0.0",
]

[project.scripts]
bbblb = "bbblb.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bbblb/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "bbblb/",
  "/uv.lock",
  "docs/",
  "tests/"
]
exclude = [

]

[tool.hatch.build.targets.wheel]
packages = ["bbblb"]
